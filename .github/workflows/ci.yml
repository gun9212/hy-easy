name: Verify
on:
  push:
  pull_request:
  # Manual run on main: redeploys the collector even without collector changes (the web deploy runs on push only).
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Verify database policies
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c 'create database hy_easy_test'
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d hy_easy_test -f tests/database-bootstrap.sql -f supabase/migrations/202611100001_initial.sql -f supabase/migrations/202611100002_list_sync.sql -f supabase/migrations/202611120001_posting_changed_at.sql -f supabase/migrations/202611180001_retry_classification.sql -f supabase/migrations/202611180002_rls_initplan.sql -f supabase/migrations/202611230001_feedback.sql -f supabase/migrations/202611230002_admin_user_stats.sql -f supabase/migrations/202611230003_usage_daily.sql -f tests/database-policies.sql

  # Production deploy to Vercel, only from main and only after every check above passed.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://hy-easy.vercel.app
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check deploy settings
        run: |
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            [ -n "${!name}" ] || { echo "::error::$name is not set in the repository settings"; exit 1; }
          done
      - run: npm install --global vercel@54.12.2
      # Vercel builds from the uploaded checkout with its own environment variables. Prebuilt uploads
      # (vercel build + deploy --prebuilt) twice hung in the UNKNOWN state and held this job for six hours.
      - run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"

  # Collector deploy to Cloud Run, only when collector code changed on main and every check passed.
  deploy-collector:
    needs: check
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: collector-production
      cancel-in-progress: false
    env:
      PROJECT: hy-easy
      REGION: asia-northeast1
      JOB: hy-easy-collector
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether collector code changed
        id: changes
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$before" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "collector=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$before" "$GITHUB_SHA" | grep -qE '^(worker/|src/lib/|package\.json|package-lock\.json|infra/cloudbuild\.yaml|\.gcloudignore)'; then
            echo "collector=true" >> "$GITHUB_OUTPUT"
          else
            echo "collector=false" >> "$GITHUB_OUTPUT"
            echo "No collector changes; skipping."
          fi
      - if: steps.changes.outputs.collector == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - if: steps.changes.outputs.collector == 'true'
        uses: google-github-actions/setup-gcloud@v2
      - name: Build the collector image
        if: steps.changes.outputs.collector == 'true'
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT/hy-easy/collector:${GITHUB_SHA::12}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          # An explicit staging dir skips gcloud's default-bucket ownership check, which needs project-wide bucket listing.
          gcloud builds submit --project "$PROJECT" --region "$REGION" \
            --gcs-source-staging-dir "gs://${PROJECT}_cloudbuild/source" \
            --config infra/cloudbuild.yaml --substitutions=_IMAGE="$IMAGE" .
      - name: Point the job at the new image
        if: steps.changes.outputs.collector == 'true'
        run: gcloud run jobs update "$JOB" --project "$PROJECT" --region "$REGION" --image "$IMAGE"

  # Database backup image (backup/). Built when it changes; the job is moved to it once Terraform has created it.
  deploy-backup:
    needs: check
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: backup-production
      cancel-in-progress: false
    env:
      PROJECT: hy-easy
      IMAGE_REGION: asia-northeast1
      JOB_REGION: asia-northeast3
      JOB: hy-easy-backup
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether the backup image changed
        id: changes
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$before" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "backup=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$before" "$GITHUB_SHA" | grep -qE '^(backup/|infra/cloudbuild-backup\.yaml)'; then
            echo "backup=true" >> "$GITHUB_OUTPUT"
          else
            echo "backup=false" >> "$GITHUB_OUTPUT"
            echo "No backup image changes; skipping."
          fi
      - if: steps.changes.outputs.backup == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - if: steps.changes.outputs.backup == 'true'
        uses: google-github-actions/setup-gcloud@v2
      - name: Build the backup image
        if: steps.changes.outputs.backup == 'true'
        run: |
          REPO="$IMAGE_REGION-docker.pkg.dev/$PROJECT/hy-easy/backup"
          echo "IMAGE=$REPO:${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          gcloud builds submit --project "$PROJECT" --region "$IMAGE_REGION" \
            --gcs-source-staging-dir "gs://${PROJECT}_cloudbuild/source" \
            --config infra/cloudbuild-backup.yaml \
            --substitutions=_IMAGE="$REPO:${GITHUB_SHA::12}",_LATEST="$REPO:latest" .
      - name: Point the job at the new image
        if: steps.changes.outputs.backup == 'true'
        run: |
          # Before the first terraform apply the job does not exist yet; Terraform then starts it on :latest.
          if gcloud run jobs describe "$JOB" --project "$PROJECT" --region "$JOB_REGION" >/dev/null 2>&1; then
            gcloud run jobs update "$JOB" --project "$PROJECT" --region "$JOB_REGION" --image "$IMAGE"
          else
            echo "Job $JOB not created yet; skipping the update."
          fi
